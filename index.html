<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Chain — a habit log</title>
<style>
  :root {
    --bg: #1B1F2A;
    --surface: #242938;
    --surface-hi: #2C3244;
    --ink: #E8E4D9;
    --ink-dim: #9CA0AE;
    --accent: #E3A857;
    --accent-dim: #6B5A3E;
    --miss: #4A4550;
    --danger: #C1666B;
    --line: #333a4d;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  @font-face {
    font-family: 'system-serif';
    src: local('Georgia');
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(227,168,87,0.06), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    padding: 48px 20px 80px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 40px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(32px, 6vw, 46px);
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }

  .sub {
    color: var(--ink-dim);
    font-size: 14.5px;
    margin: 0;
    max-width: 46ch;
    line-height: 1.5;
  }

  .add-row {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }

  .add-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 14.5px;
    font-family: inherit;
  }
  .add-row input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-row input::placeholder { color: var(--ink-dim); }

  .add-row button {
    background: var(--accent);
    color: #1B1F2A;
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .add-row button:hover { filter: brightness(1.08); }
  .add-row button:focus-visible, .add-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .habit {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px 22px;
    margin-bottom: 16px;
  }

  .habit-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }

  .habit-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }

  .habit-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .streak-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    white-space: nowrap;
  }
  .streak-count b { font-size: 15px; }

  .del-btn {
    background: none;
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 6px;
  }
  .del-btn:hover { color: var(--danger); }

  .chain {
    display: flex;
    align-items: center;
    gap: 3px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .day {
    position: relative;
    flex-shrink: 0;
    width: 22px;
    height: 22px;
  }

  .day .link {
    position: absolute;
    top: 50%;
    left: -3px;
    width: 3px;
    height: 2px;
    background: var(--accent-dim);
    transform: translateY(-50%);
  }
  .day.chained .link { background: var(--accent); }
  .day:first-child .link { display: none; }

  .dot {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface-hi);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: transparent;
    transition: transform 0.08s ease;
  }
  .dot:hover { transform: scale(1.12); }
  .dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .dot.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #1B1F2A;
  }
  .dot.today {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(227,168,87,0.25);
  }

  .empty {
    text-align: center;
    color: var(--ink-dim);
    padding: 60px 20px;
    border: 1px dashed var(--line);
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .empty .eyebrow { display: block; margin-bottom: 6px; }

  footer {
    text-align: center;
    color: var(--ink-dim);
    font-size: 12.5px;
    margin-top: 44px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Don't break the chain</p>
      <h1>The Chain</h1>
      <p class="sub">Add a habit. Mark today's link when you do it. Watch the chain grow — and don't be the one who breaks it.</p>
      <div class="add-row">
        <input id="habitInput" type="text" placeholder="New habit, e.g. Read 20 minutes" maxlength="40">
        <button id="addBtn">Add</button>
      </div>
    </header>

    <div id="habitList"></div>
    <div id="emptyState" class="empty" style="display:none;">
      <span class="eyebrow">No habits yet</span>
      Add your first one above to start your chain.
    </div>

    <footer>21-day view · saved on this device</footer>
  </div>

<script>
(function() {
  const DAYS = 21;
  const STORE_KEY = 'the-chain-habits-v1';

  // Storage wrapper: uses localStorage where available, falls back to
  // in-memory so this still works inside sandboxed previews.
  let memoryStore = null;
  function loadHabits() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return memoryStore;
    }
  }
  function saveHabits(habits) {
    memoryStore = habits;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(habits));
    } catch (e) {
      // sandboxed environment — memory fallback already set above
    }
  }

  function todayKey(offset) {
    const d = new Date();
    d.setDate(d.getDate() - offset);
    return d.toISOString().slice(0, 10);
  }

  let habits = loadHabits() || [
    { id: cryptoId(), name: 'Example: Stretch for 5 minutes', done: {} }
  ];

  function cryptoId() {
    return Math.random().toString(36).slice(2, 10);
  }

  function currentStreak(habit) {
    let streak = 0;
    for (let i = 0; i < DAYS; i++) {
      if (habit.done[todayKey(i)]) streak++;
      else break;
    }
    return streak;
  }

  function render() {
    const list = document.getElementById('habitList');
    const empty = document.getElementById('emptyState');
    list.innerHTML = '';

    if (habits.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    habits.forEach(habit => {
      const streak = currentStreak(habit);
      const card = document.createElement('div');
      card.className = 'habit';

      const top = document.createElement('div');
      top.className = 'habit-top';
      top.innerHTML = `
        <span class="habit-name"></span>
        <span class="habit-meta">
          <span class="streak-count"><b>${streak}</b> day chain</span>
          <button class="del-btn" title="Remove habit" aria-label="Remove ${habit.name}">✕</button>
        </span>
      `;
      top.querySelector('.habit-name').textContent = habit.name;
      top.querySelector('.del-btn').addEventListener('click', () => {
        habits = habits.filter(h => h.id !== habit.id);
        saveHabits(habits);
        render();
      });

      const chain = document.createElement('div');
      chain.className = 'chain';

      for (let i = DAYS - 1; i >= 0; i--) {
        const key = todayKey(i);
        const isDone = !!habit.done[key];
        const dayEl = document.createElement('div');
        dayEl.className = 'day' + (isDone && habit.done[todayKey(i + 1)] ? ' chained' : '');

        const link = document.createElement('div');
        link.className = 'link';
        dayEl.appendChild(link);

        const dot = document.createElement('button');
        dot.className = 'dot' + (isDone ? ' done' : '') + (i === 0 ? ' today' : '');
        dot.setAttribute('aria-label', key + (isDone ? ' completed' : ' not completed'));
        dot.addEventListener('click', () => {
          habit.done[key] = !habit.done[key];
          saveHabits(habits);
          render();
        });
        dayEl.appendChild(dot);
        chain.appendChild(dayEl);
      }

      card.appendChild(top);
      card.appendChild(chain);
      list.appendChild(card);
    });
  }

  document.getElementById('addBtn').addEventListener('click', addHabit);
  document.getElementById('habitInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addHabit();
  });

  function addHabit() {
    const input = document.getElementById('habitInput');
    const name = input.value.trim();
    if (!name) return;
    habits.push({ id: cryptoId(), name, done: {} });
    saveHabits(habits);
    input.value = '';
    render();
  }

  render();
})();
</script>
</body>
</html>
